apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-d
  template:
    metadata:
      labels:
        app: app-d
    spec:
      containers:
        - name: app-d
          image: <ECR_IMAGE_APP_D>
          ports:
            - containerPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: app-d
spec:
  selector:
    app: app-d
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP